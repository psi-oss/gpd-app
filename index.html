    body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a0a; color: #e5e5e5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }

    .platform-links a { color: #888; font-size: 0.85rem; text-decoration: none; padding: 0.5rem 1rem; border: 1px solid #333; border-radius: 6px; transition: border-color 0.15s, color 0.15s; }
    .platform-links a:hover { border-color: #555; color: #ccc; }
    .setup-steps { margin-top: 2.5rem; text-align: left; background: #111; border-radius: 8px; padding: 1.25rem 1.5rem; }
    .setup-steps h3 { font-size: 0.85rem; color: #888; margin-bottom: 0.75rem; font-weight: 500; }

    footer { margin-top: 3rem; color: #444; font-size: 0.75rem; }
    footer a { color: #666; text-decoration: none; }
    footer a:hover { color: #888; }

</head>

    <h1>GPD</h1>
    <p class="subtitle">Physics Research Workspace by PSI</p>
    <a id="main-download" class="download-btn" href="#"><span id="btn-text">Download</span></a>

    <div class="other-platforms">
      <h3>All platforms</h3>
      <div class="platform-links">
        <a id="link-mac-arm" href="#">macOS (Apple Silicon)</a>
        <a id="link-mac-intel" href="#">macOS (Intel)</a>
        <a id="link-win" href="#">Windows</a>
        <a id="link-linux" href="#">Linux</a>

    </div>
    <div class="setup-steps">
      <h3>Getting started</h3>
      <ol>
        <li>Download and install GPD</li>
        <li>Open GPD and paste your API key</li>
        <li>Type <code>/gpd-new-project</code> to start</li>
      </ol>
    </div>

  </div>
  <script>
    const REPO = 'psi-oss/opencode';
    const VERSION = '1.1.0-2';
    const TAG = 'gpd-desktop-v' + VERSION;
    const assets = {
      'mac-arm':   `https://github.com/${REPO}/releases/download/${TAG}/GPD_${VERSION}_aarch64.dmg`,
      'mac-intel': `https://github.com/${REPO}/releases/download/${TAG}/GPD_${VERSION}_x64.dmg`,
      'win':       `https://github.com/${REPO}/releases/download/${TAG}/GPD_${VERSION}_x64-setup.exe`,
      'linux':     `https://github.com/${REPO}/releases/download/${TAG}/GPD_${VERSION}_amd64.deb`,
    };
    const ua = navigator.userAgent.toLowerCase();
    const platform = navigator.platform?.toLowerCase() || '';
    let detected = 'mac-arm';
    if (ua.includes('win')) detected = 'win';
    else if (ua.includes('linux')) detected = 'linux';
    const labels = { 'mac-arm': 'Download for macOS', 'mac-intel': 'Download for macOS (Intel)', 'win': 'Download for Windows', 'linux': 'Download for Linux' };
    const notes = { 'mac-arm': 'Apple Silicon (M1/M2/M3/M4) — .dmg', 'mac-intel': 'Intel Mac — .dmg', 'win': 'Windows 10+ — .exe', 'linux': 'Linux x64 — .deb' };
    document.getElementById('main-download').href = assets[detected];
    document.getElementById('btn-text').textContent = labels[detected];
    document.getElementById('platform-note').textContent = notes[detected];
    document.getElementById('link-mac-arm').href = assets['mac-arm'];
    document.getElementById('link-mac-intel').href = assets['mac-intel'];
    document.getElementById('link-win').href = assets['win'];
    document.getElementById('link-linux').href = assets['linux'];
  </script>
