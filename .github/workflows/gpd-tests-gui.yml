          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Job 5: ipc-and-broad — Tauri IPC contract + broad menu/UI tests
  #
  # Modeled on the surfaces job. Rebuilds the Tauri debug bundle from scratch
  # (same pattern as surfaces + regression). Build-artifact sharing across
  # jobs would cut ~10 min per job but adds complexity (uploading / unpacking
  # the .app bundle + preserving exec bits / codesign) — tracked as follow-up.
  # ---------------------------------------------------------------------------
  ipc-and-broad:
    name: IPC + broad tests
    needs: [smoke-and-flows, harness-selftest]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PYTEST_CI: "1"
      PYTEST_COLD_START: "1"
      PYTEST_QUIT_GPD: "1"
    steps:
      - uses: actions/checkout@v4
