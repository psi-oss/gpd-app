name: GPD GUI Test Suite

# Runs unit + smoke + flows (non-real-backend) against a locally-built debug
# GPD on macOS arm64. Real-backend flows run only when GPD_TEST_ANTHROPIC_KEY
# is configured as a repository secret.
#
# NOTE (first-run CI): smoke-and-flows may fail due to macOS Accessibility
# permission — GitHub-hosted runners don't grant AX to arbitrary processes.
# The HTTP-only tests (sidecar health, HTTP driver unit tests) will still pass.
# Subsequent AX failures should be treated as known CI limitations, not
# regressions, until a provisioned self-hosted runner is available.

on:
  push:
    paths:
      - "packages/desktop/tests-gui/**"
      - "packages/desktop/src-tauri/**"
      - "packages/desktop/src/**"
      - ".github/workflows/gpd-tests-gui.yml"
  pull_request:
    branches:
      - gpd
  workflow_dispatch:
    inputs:
      run_lifecycle:
        description: "Run the destructive lifecycle suite (quits + relaunches GPD). Only use on a trusted runner."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: gpd-tests-gui-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_BUNDLE_VERSION: "0.7.3"

jobs:
  # ---------------------------------------------------------------------------
  # Job 0: harness-selftest — invariants that must hold for any other test
  # result to be trusted. Runs parallel to unit; GPD-dependent jobs require it.
  # ---------------------------------------------------------------------------
  harness-selftest:
    name: Harness self-test invariants
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/desktop/tests-gui
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v6
        with:
          uv-version: "0.7.3"

      - name: Install test dependencies
        run: uv sync

      - name: Run harness selftest
        run: uv run pytest -m harness_selftest -v --junitxml=junit-harness-selftest.xml

      - name: Upload harness-selftest junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-harness-selftest
          path: packages/desktop/tests-gui/junit-harness-selftest.xml
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Job 1: unit — fast, no GPD needed
  # ---------------------------------------------------------------------------
  unit:
    name: Unit tests
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/desktop/tests-gui
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v6
        with:
          uv-version: "0.7.3"

      - name: Install test dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest -m unit -q

      - name: Coverage + threshold gate
        working-directory: packages/desktop/tests-gui
        run: |
          uv run pytest -m unit --cov=gpd_tests --cov-branch \
            --cov-report=term --cov-report=xml \
            --cov-fail-under=55

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-unit
          path: packages/desktop/tests-gui/coverage.xml
          retention-days: 14
          if-no-files-found: ignore

      - name: Coverage summary
        if: always()
        working-directory: packages/desktop/tests-gui
        run: |
          echo "## Coverage (unit)" >> $GITHUB_STEP_SUMMARY
          uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY || true

  # ---------------------------------------------------------------------------
  # Job 2: smoke-and-flows — builds GPD debug, launches it, runs tests
  # ---------------------------------------------------------------------------
  smoke-and-flows:
    name: Smoke + flows (debug build)
    needs: [unit, harness-selftest]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Disable slow-mo for CI and force HTML report generation
      PYTEST_CI: "1"
      # Cold-start: kill any stale GPD/opencode-cli before launching
      PYTEST_COLD_START: "1"
      # Quit GPD cleanly at the end of the session
      PYTEST_QUIT_GPD: "1"
    steps:
      # -----------------------------------------------------------------------
      # Checkout + toolchain
      # -----------------------------------------------------------------------
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: aarch64-apple-darwin-debug

      - uses: astral-sh/setup-uv@v6
        with:
          uv-version: "0.7.3"

      # -----------------------------------------------------------------------
      # Runtime dependency: cliclick (required by OSInputClient)
      # -----------------------------------------------------------------------
      - name: Install cliclick
        run: brew install cliclick

      # -----------------------------------------------------------------------
      # JS dependencies
      # -----------------------------------------------------------------------
      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # -----------------------------------------------------------------------
      # Build opencode sidecar (bundles the opencode-cli binary into the
      # Tauri sidecar folder so the desktop app can spawn it at runtime)
      # -----------------------------------------------------------------------
      - name: Build opencode sidecar
        working-directory: packages/desktop
        run: bun run predev
        env:
          RUST_TARGET: aarch64-apple-darwin
          # predev.ts reads TAURI_ENV_TARGET_TRIPLE as an alias for RUST_TARGET
          TAURI_ENV_TARGET_TRIPLE: aarch64-apple-darwin

      # -----------------------------------------------------------------------
      # Stage bundled uv binary (same snippet as gpd-release.yml:186-205,
      # aarch64-apple-darwin only)
      # -----------------------------------------------------------------------
      - name: Download and stage uv bundle
        shell: bash
        run: |
          UV_PLATFORM="aarch64-apple-darwin"
          mkdir -p packages/desktop/src-tauri/uv-bundle
          curl -fsSL "https://github.com/astral-sh/uv/releases/download/${{ env.UV_BUNDLE_VERSION }}/uv-${UV_PLATFORM}.tar.gz" \
            | tar xz -C packages/desktop/src-tauri/uv-bundle --strip-components=1
          chmod +x packages/desktop/src-tauri/uv-bundle/uv
          echo "uv binary staged: $(du -sh packages/desktop/src-tauri/uv-bundle | cut -f1)"

      # -----------------------------------------------------------------------
      # Build debug Tauri bundle
      # A debug build is sufficient — release build requires signing/notarization.
      # The MCP plugin (tauri-plugin-mcp) is gated on #[cfg(debug_assertions)]
      # so it will be present in this build.
      # -----------------------------------------------------------------------
      - name: Build debug Tauri bundle
        working-directory: packages/desktop
        run: bun run tauri build --debug
        env:
          # Suppress Tauri upload steps (we don't publish from here)
          GITHUB_TOKEN: ${{ github.token }}

      # -----------------------------------------------------------------------
      # Resolve the debug bundle path.
      # When TAURI_ENV_TARGET_TRIPLE (set by the rust-toolchain action) points
      # at a specific triple, Tauri writes to target/<triple>/debug/bundle/...;
      # without a target override it writes to target/debug/bundle/... . Try
      # both so the workflow works on either CI or a developer laptop.
      # -----------------------------------------------------------------------
      - name: Resolve debug bundle path
        shell: bash
        run: |
          BUNDLE_ROOT="packages/desktop/src-tauri/target"
          BUNDLE=""
          for candidate in \
            "$BUNDLE_ROOT/aarch64-apple-darwin/debug/bundle/macos/GPD Dev.app" \
            "$BUNDLE_ROOT/debug/bundle/macos/GPD Dev.app"; do
            if [ -e "$candidate/Contents/MacOS" ]; then
              BUNDLE="$candidate"
              break
            fi
          done
          if [ -z "$BUNDLE" ]; then
            echo "No debug bundle found under $BUNDLE_ROOT/{aarch64-apple-darwin/,}debug/bundle/macos/"
            find "$BUNDLE_ROOT" -maxdepth 4 -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi
          echo "Using bundle: $BUNDLE"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # Verify the debug bundle produced the expected .app
      # -----------------------------------------------------------------------
      - name: Verify debug bundle
        shell: bash
        run: |
          test -d "$BUNDLE" || { echo "bundle not found at $BUNDLE"; exit 1; }
          grep -qF "tauri-plugin-mcp" "$BUNDLE/Contents/MacOS/GPD" || { echo "MCP plugin missing from debug bundle"; exit 1; }

      # -----------------------------------------------------------------------
      # Accessibility permission
      # GitHub-hosted runners do not grant AX access to new processes.
      # We attempt a best-effort tccutil reset; failure is non-fatal.
      # Tests that require AX will skip/fail gracefully via pytest marks.
      # -----------------------------------------------------------------------
      - name: Attempt AX permission grant (best-effort)
        continue-on-error: true
        run: |
          # tccutil is available on macOS runners but requires SIP disabled
          # to reset entries for processes not already in the TCC database.
          # This step is here as a hook for future self-hosted runner setups.
          echo "::notice::AX permission cannot be granted on GitHub-hosted runners."
          echo "::notice::Tests requiring AX will report failures — this is expected on first run."

      # -----------------------------------------------------------------------
      # Install Python test dependencies BEFORE launching GPD so the
      # 10s warm-up window is actual warm-up, not Python-install-wait.
      # -----------------------------------------------------------------------
      - name: Install test dependencies
        working-directory: packages/desktop/tests-gui
        run: uv sync

      # -----------------------------------------------------------------------
      # Launch GPD Dev and wait for sidecar to appear
      # -----------------------------------------------------------------------
      - name: Launch GPD Dev
        run: |
          APP_PATH="${GITHUB_WORKSPACE}/${BUNDLE}"
          echo "GPD_APP_PATH=${APP_PATH}" >> "$GITHUB_ENV"
          open "${APP_PATH}"
          echo "Waiting for sidecar (opencode-cli serve) to appear..."
          for i in $(seq 1 30); do
            if pgrep -f "opencode-cli.*serve" >/dev/null; then break; fi
            sleep 0.5
          done
          pgrep -f "opencode-cli.*serve" || { echo "sidecar never appeared"; exit 1; }

      # -----------------------------------------------------------------------
      # Conditional: seed onboarding state when real-backend secret is present.
      # Uses the two-flag guard from conftest.py to avoid accidental clobber.
      # -----------------------------------------------------------------------
      - name: Configure real-backend env (if secret present)
        env:
          ANTHROPIC_KEY: ${{ secrets.GPD_TEST_ANTHROPIC_KEY }}
        run: |
          if [ -n "$ANTHROPIC_KEY" ]; then
            echo "GPD_TEST_ANTHROPIC_KEY=$ANTHROPIC_KEY" >> "$GITHUB_ENV"
            echo "GPD_TEST_SEED_ONBOARDING=1" >> "$GITHUB_ENV"
          fi

      # -----------------------------------------------------------------------
      # Run smoke + non-real-backend flows
      # Excludes restart tests (destructive) and real_backend tests (need key).
      # -----------------------------------------------------------------------
      - name: Run smoke + flows (non-real-backend)
        working-directory: packages/desktop/tests-gui
        run: |
          uv run pytest \
            -m "(smoke and not restart) or (flows and not real_backend)" \
            -v \
            --cov=gpd_tests \
            --cov-branch \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-report=xml \
            --html=artifacts/report.html \
            --self-contained-html

      # -----------------------------------------------------------------------
      # Optional: run real-backend flows when GPD_TEST_ANTHROPIC_KEY is set.
      # This step is independent of the smoke step — failures here do NOT block
      # PRs that lack the secret. Fork PRs will never have the secret.
      # -----------------------------------------------------------------------
      - name: Run real-backend flows (optional, requires secret)
        if: ${{ env.GPD_TEST_ANTHROPIC_KEY != '' }}
        working-directory: packages/desktop/tests-gui
        run: |
          uv run pytest \
            -m "flows and real_backend" \
            -v \
            --reruns 2 \
            --reruns-delay 5 \
            --cov=gpd_tests \
            --cov-branch \
            --cov-append \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-report=xml \
            --html=artifacts/report-real-backend.html \
            --self-contained-html
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Upload artifacts on any failure (screenshots, window dumps, HTML report)
      # -----------------------------------------------------------------------
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gpd-tests-gui-artifacts-${{ github.run_id }}
          path: packages/desktop/tests-gui/artifacts/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-smoke-and-flows
          path: packages/desktop/tests-gui/coverage_html/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-smoke-and-flows
          path: packages/desktop/tests-gui/coverage.xml
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
