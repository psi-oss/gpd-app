name: GPD Sync Installer Scripts to Pages

# Publishes the install + uninstall scripts to the gh-pages branch
# served at download.gpd.psi.inc, alongside a SHA256SUMS.txt manifest
# users can verify before execution.
#
# Published files (URL → source):
#   /install              ← install-gpd/install                          (mac + linux installer, unified)
#   /install.ps1          ← install-gpd/windows_11/install.ps1           (windows bootstrap, ASCII-only)
#   /install_main.ps1     ← install-gpd/windows_11/install_main.ps1      (windows full installer)
#   /uninstall            ← install-gpd/uninstall                        (mac + linux uninstaller, unified)
#   /uninstall.sh         ← install-gpd/uninstall                        (alias of /uninstall for backwards-compat)
#   /uninstall.ps1        ← install-gpd/windows_11/uninstall.ps1         (windows bootstrap, ASCII-only)
#   /uninstall_main.ps1   ← install-gpd/windows_11/uninstall_main.ps1    (windows full uninstaller)
#
# Windows two-file pattern:
#   The /install.ps1 + /uninstall.ps1 endpoints serve a tiny ASCII-only
#   bootstrap that fetches the full *_main.ps1 with explicit UTF-8
#   decoding (via Net.WebClient, not Invoke-RestMethod) and evaluates
#   it as a scriptblock. PowerShell 5.1 + irm defaults to ISO-8859-1
#   when the response Content-Type lacks a charset, which on
#   non-English locales (PT-BR observed) turned the UTF-8 BOM + the
#   box-drawing banner + accented comments into mojibake the parser
#   rejected. The bootstrap avoids `iex`-on-mojibake entirely.
#
# SHA256SUMS.txt covers all seven published files.
#
# Trust anchor: once this workflow runs, users who install via
# `curl | bash` / `irm | iex` can verify the installer content they're
# about to execute against a hash published on a PSI-owned domain.
# Example verify flow:
#
#   # macOS / Linux
#   curl -fsSL https://download.gpd.psi.inc/install -o /tmp/gpd-install
#   curl -fsSL https://download.gpd.psi.inc/SHA256SUMS.txt \
#     | awk '$2 == "install" {print $1"  /tmp/gpd-install"}' | shasum -a 256 -c
#
#   # Windows PowerShell
#   Invoke-WebRequest https://download.gpd.psi.inc/install.ps1 -OutFile $env:TEMP\gpd-install.ps1
#   $sums = (Invoke-WebRequest https://download.gpd.psi.inc/SHA256SUMS.txt).Content
#   $expected = ($sums -split "`n" | Where-Object { $_ -match 'install\.ps1$' } | ForEach-Object { $_.Split()[0] })
#   $actual = (Get-FileHash $env:TEMP\gpd-install.ps1 -Algorithm SHA256).Hash.ToLower()
#   if ($expected -ne $actual) { throw "SHA256 mismatch" }
#
# This does NOT cover the binary artifacts (opencode-cli, desktop .exe /
# .dmg / .deb) which are fetched by the installer at runtime — those
# need per-release SHA256SUMS published on the GitHub release and
# verified in-script. Tracked as a follow-up.

on:
  push:
    branches: [gpd]
    paths:
      - "install-gpd/install"
      - "install-gpd/uninstall"
      - "install-gpd/windows_11/install.ps1"
      - "install-gpd/windows_11/install_main.ps1"
      - "install-gpd/windows_11/uninstall.ps1"
      - "install-gpd/windows_11/uninstall_main.ps1"
      - ".github/workflows/gpd-sync-installer-to-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Only one sync in flight at a time. If two pushes land within seconds
  # the second cancels the first; the final state is whatever's on the
  # triggering SHA, which is what we want.
  group: gpd-installer-pages-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (triggering SHA on gpd)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: src

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Stage installer files + compute SHA256SUMS.txt
        working-directory: pages
        run: |
          set -euo pipefail
          # Copy installer + uninstaller scripts from source into the
          # gh-pages tree. Target names match URL paths users are
          # instructed to fetch:
          #   https://download.gpd.psi.inc/install     (mac+linux installer)
          #   https://download.gpd.psi.inc/install.ps1 (windows installer)
          #   https://download.gpd.psi.inc/uninstall   (mac+linux uninstaller, unified)
          #   https://download.gpd.psi.inc/uninstall.sh   (alias of /uninstall for backwards-compat)
          #   https://download.gpd.psi.inc/uninstall.ps1  (windows uninstaller)
          #
          # uninstall is a single source file that auto-detects darwin
          # vs linux at runtime, mirroring `install`. /uninstall.sh is
          # kept as an alias of /uninstall so older READMEs / scripts
          # that reference the .sh URL continue to work.
          # Windows split: /install.ps1 is a tiny ASCII-only bootstrap
          # that downloads /install_main.ps1 with explicit UTF-8 decoding
          # and evaluates it as a scriptblock. The bootstrap exists
          # because PowerShell 5.1 + Invoke-RestMethod defaults to
          # ISO-8859-1 decoding in non-English locales, which corrupts
          # UTF-8 BOM + box-drawing chars + accented comments in the
          # full installer when piped through `iex`. The bootstrap
          # avoids that by using WebClient with Encoding = UTF8.
          install -m 0755 ../src/install-gpd/install                     ./install
          install -m 0644 ../src/install-gpd/windows_11/install.ps1      ./install.ps1
          install -m 0644 ../src/install-gpd/windows_11/install_main.ps1 ./install_main.ps1
          install -m 0755 ../src/install-gpd/uninstall                   ./uninstall
          install -m 0755 ../src/install-gpd/uninstall                   ./uninstall.sh
          install -m 0644 ../src/install-gpd/windows_11/uninstall.ps1    ./uninstall.ps1
          install -m 0644 ../src/install-gpd/windows_11/uninstall_main.ps1 ./uninstall_main.ps1

          # Generate SHA256SUMS.txt with deterministic (sorted) ordering
          # so the file is stable across runs when only one entry
          # changes. Two columns: `<hash>  <filename>` — the coreutils
          # format accepted by `sha256sum -c` and `shasum -a 256 -c`.
          {
            sha256sum install
            sha256sum install.ps1
            sha256sum install_main.ps1
            sha256sum uninstall
            sha256sum uninstall.sh
            sha256sum uninstall.ps1
            sha256sum uninstall_main.ps1
          } | sort -k2 > SHA256SUMS.txt

          # Record the source commit so users / auditors can reproduce
          # the build. Not used for verification, just for traceability.
          echo "source_commit=${GITHUB_SHA}" > SHA256SUMS.meta
          echo "source_ref=${GITHUB_REF}" >> SHA256SUMS.meta
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> SHA256SUMS.meta

      - name: Commit and push if changed
        working-directory: pages
        env:
          # Use the actions bot identity so history shows the commit
          # came from CI, not a human. Matches the existing
          # gpd-download-page.yml workflow's commit author.
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
          git add install install.ps1 install_main.ps1 uninstall uninstall.sh uninstall.ps1 uninstall_main.ps1 SHA256SUMS.txt SHA256SUMS.meta
          if git diff --cached --quiet; then
            echo "No installer changes; nothing to publish."
            exit 0
          fi
          # Short commit message referencing the source SHA so the
          # gh-pages history is auditable against the gpd branch.
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          git commit -m "Sync installer scripts to pages (source ${short_sha})"
          git push
