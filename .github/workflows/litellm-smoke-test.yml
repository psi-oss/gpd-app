name: LiteLLM /gpd smoke tests

# Posts live requests to /gpd/log AND /gpd/tos-accept, asserts 200 +
# well-formed response on each. Detects:
#   - upstream LiteLLM rename that breaks our LiteLLMRoutes.openai_routes
#     monkey-patch in infra/litellm/gpd_{log,tos}/hook.py
#   - stale Dockerfile pin with missing security patches
#   - Railway misconfig (missing GPD_USER_HASH_PEPPER / GPD_LOG_BUCKET /
#     GPD_AUDIT_DATABASE_URL / SA JSON env vars)
#   - GCS IAM/bucket drift
#   - gpd_audit DB migrations failed / wrong schema
#
# Uses a long-lived canary virtual key (user_id="gpd-smoke-canary") stored
# as a GH secret. Rotate quarterly via `bq ... /key/regenerate`.

on:
  push:
    branches: [gpd]
    paths:
      - 'infra/litellm/**'
      - '.github/workflows/litellm-smoke-test.yml'
  schedule:
    - cron: '17 7 * * 1'  # Mondays 07:17 UTC — catches upstream breakage
  workflow_dispatch:

concurrency:
  group: litellm-smoke-test
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pre-flight: bring the canary up to the current TOS floor.
      # /gpd/log is consent-gated, so the very first call from a freshly-
      # rotated canary returns 403 (`tos_version_outdated`) until a /gpd/
      # tos-accept lands. Running tos-accept FIRST means the smoke job
      # self-bootstraps after a key rotation — no manual curl required.
      # We use the live TOS major (1) so the proxy's GPD_MIN_TOS_VERSION
      # gate is satisfied; the SHAs are throwaway (the smoke doesn't
      # verify them, it just proves the endpoint accepts + stores).
      - name: POST /gpd/tos-accept (pre-flight, satisfies consent gate)
        env:
          GPD_LOG_URL: ${{ secrets.GPD_LOG_URL }}
          CANARY_KEY: ${{ secrets.LITELLM_SMOKE_CANARY_KEY }}
        run: |
          set -euo pipefail
          BASE="${GPD_LOG_URL%/gpd/log}"

          SHA=$(python3 -c 'import secrets; print(secrets.token_hex(32))')
          PSHA=$(python3 -c 'import secrets; print(secrets.token_hex(32))')

          HTTP=$(curl -sS -o /tmp/tos.json -w '%{http_code}' \
            -X POST "$BASE/gpd/tos-accept?tos_version=1.0&tos_text_sha256=$SHA&privacy_text_sha256=$PSHA&app_version=smoke-ci&viewed_in_full=1" \
            -H "Authorization: Bearer $CANARY_KEY" \
            -H "User-Agent: gh-actions-smoke/1.0")

          echo "HTTP $HTTP"
          cat /tmp/tos.json
          echo

          if [ "$HTTP" != "200" ]; then
            echo "::error::smoke test failed: non-200 from /gpd/tos-accept"
            exit 1
          fi
          if ! jq -e '.ok == true' /tmp/tos.json >/dev/null; then
            echo "::error::smoke test failed: /gpd/tos-accept response shape unexpected"
            exit 1
          fi
          echo "/gpd/tos-accept smoke OK"

          # Negative case: missing tos_version → 400
          NEG_HTTP=$(curl -sS -o /tmp/neg.json -w '%{http_code}' \
            -X POST "$BASE/gpd/tos-accept?tos_text_sha256=$SHA&privacy_text_sha256=$PSHA" \
            -H "Authorization: Bearer $CANARY_KEY")
          if [ "$NEG_HTTP" != "400" ]; then
            echo "::error::expected 400 on missing tos_version, got $NEG_HTTP"
            cat /tmp/neg.json
            exit 1
          fi
          echo "/gpd/tos-accept negative case OK"

      - name: POST /gpd/log
        env:
          GPD_LOG_URL: ${{ secrets.GPD_LOG_URL }}
          CANARY_KEY: ${{ secrets.LITELLM_SMOKE_CANARY_KEY }}
        run: |
          set -euo pipefail

          # 26-char Crockford ULID from Python (ulidtools not needed for a
          # random-enough test value).
          SEQ=$(python3 -c 'import secrets; a="0123456789ABCDEFGHJKMNPQRSTVWXYZ"; print("".join(secrets.choice(a) for _ in range(26)))')
          BODY=$(printf '{"kind":"smoke","v":1,"ts":%d,"sessionID":"ses_smoke_ci","rootSessionID":"ses_smoke_ci"}\n' "$(date +%s%3N)")
          GZ=$(mktemp --suffix=.gz)
          printf '%s' "$BODY" | gzip -c > "$GZ"

          HTTP=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST "$GPD_LOG_URL?session=ses_smoke_ci&root_session=ses_smoke_ci&seq=$SEQ" \
            -H "Authorization: Bearer $CANARY_KEY" \
            -H "Content-Encoding: gzip" \
            -H "Content-Type: application/x-ndjson" \
            --data-binary "@$GZ")

          echo "HTTP $HTTP"
          cat /tmp/resp.json
          echo

          if [ "$HTTP" != "200" ]; then
            echo "::error::smoke test failed: non-200 from /gpd/log"
            exit 1
          fi

          # Shape check: response must include "ok":true and "path":"user=..."
          if ! jq -e '.ok == true and (.path | startswith("user="))' /tmp/resp.json >/dev/null; then
            echo "::error::smoke test failed: response shape unexpected"
            exit 1
          fi

          echo "/gpd/log smoke OK — path: $(jq -r .path /tmp/resp.json)"
